services:
  postgres:
    image: postgres:16
    container_name: aquaguard-postgres
    environment:
      POSTGRES_USER: aquaguard
      POSTGRES_PASSWORD: aquaguard
      POSTGRES_DB: aquaguard
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
